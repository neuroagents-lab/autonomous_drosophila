# VALOR (Achiam et al., 2018): decode the skill from a whole skill segment.
# The reward is paid when the segment ends.
type: valor
# Completed skill segments per update.
replay_batch_size: 128
# Resample skills every 5 s (50 decisions at decision_dt=0.1).
skill_horizon: 50
kwargs:  # ssrl.idms.VALOR
  num_skills: 12
  skill_dim: 0
  prior_name: uniform_categorical
  hidden_dim: 256
  n_layers: 1
  num_subseq: 11
  entropy_coef: 0.0
  posterior_type: dot_product
  temperature: 0.1
  subtract_log_prior: true
  reward_at_end: true
  head_hidden_dim: 0
  act: relu
