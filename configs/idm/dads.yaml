# DADS (Sharma et al., 2020): dynamics-aware skill discovery.
type: dads
normalize_intrinsic: true
# Resample skills every 10 s (100 decisions at decision_dt=0.1).
skill_horizon: 100
kwargs:  # ssrl.idms.DADS
  num_skills: 2
  skill_dim: 2
  prior_name: uniform_box
  prior_kwargs:
    low: -1.0
    high: 1.0
  hidden_dim: 512
  n_layers: 2
  entropy_coef: 0.0
  use_marginal_model: false
  # The authors' Ant-XY reference configuration samples 100 alternative skills.
  marginal_samples: 100
  act: relu
